name: CI

# Canonical ours.network single-package publish flow, with Chromium installed
# because messenger's full gate includes its browser suite.
# Required secrets: NPM_TOKEN, VERSION_BUMP_APP_ID, and
# VERSION_BUMP_APP_PRIVATE_KEY.

on:
  push:
    branches: [main, prerelease]
  pull_request:
    branches: [main, prerelease]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-latest
    name: Gates (typecheck · build · test)
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: node --test tests/release-channel.test.mjs
      - run: npm ci
      - name: Verify reviewed dependency installer
        run: node --test .github/scripts/review-sdk-install.test.mjs
      # Cross-repository review gate only. Published dependency qualification
      # remains required before release; no release job uses these artifacts.
      - name: Require same-repository review access
        if: github.event_name == 'pull_request'
        env:
          SAME_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          test "$SAME_REPOSITORY" = true || { echo "::error::Private SDK review requires a same-repository PR; fork secrets are unavailable"; exit 1; }
      - name: Read-only access to reviewed SDK
        if: github.event_name == 'pull_request'
        id: review-sdk-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.VERSION_BUMP_APP_ID }}
          private-key: ${{ secrets.VERSION_BUMP_APP_PRIVATE_KEY }}
          owner: adapt-toolkit
          repositories: ours-sdk
          permission-contents: read
      - name: Check out exact reviewed SDK
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          repository: adapt-toolkit/ours-sdk
          ref: 5c757379718958f65f2287f62a5810ce25ecb621
          token: ${{ steps.review-sdk-token.outputs.token }}
          path: .review-sdk
          submodules: recursive
          persist-credentials: false
      - name: Build reviewed SDK and CLI artifacts
        if: github.event_name == 'pull_request'
        working-directory: .review-sdk
        run: |
          test "$(git rev-parse HEAD)" = 5c757379718958f65f2287f62a5810ce25ecb621
          npm ci --no-audit --no-fund
          bash scripts/compile-mufl.sh
          npm run build
          npm run build:cli
          mkdir -p "$RUNNER_TEMP/review-sdk-artifacts"
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/review-sdk-artifacts"
          npm pack --workspace @ours.network/cli --ignore-scripts --pack-destination "$RUNNER_TEMP/review-sdk-artifacts"
      - name: Keep dependency checkout outside consumer test discovery
        if: github.event_name == 'pull_request'
        run: mv .review-sdk "$RUNNER_TEMP/review-sdk-source"
      - name: Install and verify reviewed dependency graph
        if: github.event_name == 'pull_request'
        run: >-
          node .github/scripts/review-sdk-install.mjs .
          "$RUNNER_TEMP/review-sdk-artifacts/ours.network-sdk-3.8.0.tgz"
          "$RUNNER_TEMP/review-sdk-artifacts/ours.network-cli-2.8.0.tgz"
          5c757379718958f65f2287f62a5810ce25ecb621
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm pack --dry-run

  version-bump:
    needs: gates
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    name: Version bump
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      bumped: ${{ steps.bump.outputs.bumped }}
      new-sha: ${{ steps.bump.outputs.new-sha }}
      version: ${{ steps.bump.outputs.version }}
    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.VERSION_BUMP_APP_ID }}
          private-key: ${{ secrets.VERSION_BUMP_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          token: ${{ steps.app-token.outputs.token }}
      - name: Run version bump
        id: bump
        env:
          PKG_PATH: package.json
        run: bash .github/workflows/scripts/bump-version.sh

  npm-publish:
    needs: [gates, version-bump]
    if: needs.version-bump.outputs.bumped == 'true'
    runs-on: ubuntu-latest
    name: Publish to npm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version-bump.outputs.new-sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run build
      - name: Verify stable channel
        run: bash .github/workflows/scripts/publish-guard.sh stable package.json latest
      - name: Publish @ours.network/messenger-server
        run: npm publish --tag latest --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  nightly-publish:
    needs: gates
    if: github.event_name == 'push' && github.ref == 'refs/heads/prerelease'
    runs-on: ubuntu-latest
    name: Publish nightly to npm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Compute ephemeral nightly version
        run: bash .github/workflows/scripts/bump-nightly.sh
      - run: npm run build
      - name: Publish guarded nightly
        run: bash .github/workflows/scripts/publish-nightly.sh
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
