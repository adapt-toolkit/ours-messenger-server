<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Calm workspace theme proposal</title><link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="prototype-bar"><strong>Calm workspace proposal</strong><span>Static fixtures · semantic tokens</span><button id="mobileToggle" type="button" aria-pressed="false">Mobile layout</button><button id="mobilePane" type="button" disabled>Show room list</button></header>
  <main class="comparison" aria-label="Light and dark theme comparison">
    <section class="theme theme-light" aria-labelledby="light-title"><h1 id="light-title">Light · warm linen</h1><div class="workspace" data-workspace></div></section>
    <section class="theme theme-dark" aria-labelledby="dark-title"><h1 id="dark-title">Dark · moss charcoal</h1><div class="workspace" data-workspace></div></section>
  </main>
  <dialog id="details" class="theme theme-light"><div class="sheet"><header><div><strong>Agent details</strong><small>Verified delegation · active</small></div><button type="button" id="dialogClose" aria-label="Close">×</button></header><p>This floating sheet uses semantic roles, one restrained shadow, and a solid reduced-transparency fallback.</p><button class="destructive" type="button">Remove agent…</button></div></dialog>
  <template id="workspaceTemplate">
    <nav class="rooms" aria-label="Rooms"><header><div><small>Private workspace</small><strong>Messenger</strong></div><button aria-label="New room">＋</button></header><label class="search">Search rooms <input type="search" placeholder="Search"></label><ul>
      <li><button class="room selected" aria-current="page"><span class="avatar human">M</span><span><strong>Design review</strong><small>Read · selected, no unread</small></span></button></li>
      <li><button class="room unread" aria-label="Research agent, 2 unread"><span class="avatar agent">A</span><span><strong>Research agent</strong><small>Agent prepared a token map</small></span><span class="count">2</span></button></li>
      <li><button class="room pending"><span class="avatar">C</span><span><strong>Critic</strong><small>◷ Pending verification</small></span></button></li>
    </ul><div class="states"><span class="chip success">✓ Connected</span><span class="chip warning">△ Attention</span><span class="chip error">! Failed</span><button disabled>Unavailable</button></div></nav>
    <section class="conversation" aria-label="Conversation"><header><button class="back" aria-label="Back to rooms">‹</button><div><strong>Design review</strong><small>3 participants · encrypted room</small></div><span class="verified">✓ Provenance visible</span></header>
      <div class="app-states" aria-label="Application state fixtures"><div><strong>Empty</strong><span>No messages yet · Start a private conversation.</span></div><div><strong>Loading</strong><span class="spinner">◌</span><span>Loading trusted history…</span></div><div class="app-error"><strong>Error</strong><span>History unavailable.</span><button type="button">Retry</button></div></div>
      <ol class="messages" aria-label="Message history">
        <li class="system"><span>System</span><p>Agent joined with verified delegation. Identity and delivery details remain available.</p></li>
        <li class="message agent-msg"><div class="meta"><strong>Atlas</strong><span>Agent · 10:42</span></div><p>I mapped the current cascade. Seven stylesheets redefine shared roles, so breakpoint and theme order can change meaning.</p><blockquote>Replying to Maya: “Keep status legible without neon.”</blockquote><pre><code>:root {
  --color-canvas: #F4F1EA;
  --color-action-primary: #2F6F62;
}</code></pre><small class="delivery">✓✓ Delivered</small></li>
        <li class="message human-msg"><div class="meta"><strong>Maya</strong><span>Human · 10:45</span></div><p>Good. Keep the operational detail, but make the reading surface calmer for a long session.</p><small class="delivery">✓✓ Read 10:46</small></li>
        <li class="message failed"><div class="meta"><strong>Atlas</strong><span>Agent · 10:47</span></div><p>Contrast report attached.</p><div class="attachment">▣ contrast-report.md <span>12 KB</span></div><small class="delivery">! Delivery failed · Retry</small></li>
      </ol>
      <div class="state-strip" aria-label="Additional state examples"><span>◷ Sending</span><span>✓ Sent</span><span>✓✓ Delivered</span><span>✓✓ Read</span></div>
      <form class="composer"><div class="reply"><span>Replying to Atlas</span><button aria-label="Cancel reply" type="button">×</button></div><label>Message <textarea rows="2" placeholder="Write a message…"></textarea></label><div><button type="button" disabled>＋ Attach</button><button type="button" data-dialog-theme>Agent details</button><small>Enter to send · Shift+Enter for newline</small><button class="primary" type="button">Send</button></div></form>
    </section>
  </template>
  <script src="prototype.js"></script>
</body></html>
